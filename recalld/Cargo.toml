# recalld — recall's system-of-record daemon on the fleet (docs/architecture.md).
#
# The Rust replacement for the Python fleet tier, built stage by stage. Stage A
# is the ingest plane: an append-only blob store behind an authenticated HTTP
# surface, with sha-256 receipts the recorders verify before they will ever
# evict a local copy. Later stages add VAD, the room builder, the work queue,
# and finally the browsing API.
#
# It shares no code with audiod yet; stage D extracts the DSP both need into a
# workspace library. What they already share is posture: no unsafe, pedantic
# clippy, and the same segment-name grammar (`<source>-YYYYMMDDTHHMMSS.<ext>`).
[package]
name = "recalld"
version = "0.1.0"
edition = "2024"

[lints.rust]
# Sockets, files and SQL — nothing here needs unsafe, and `forbid` makes
# adding any a visible edit to this file.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A binary plus its own tests, not a published API; `# Errors` sections would
# document a boundary that does not exist.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# The calibration scanner's quantile arithmetic moves between usize/f64/f32 at
# a handful of deliberate sites, none near a precision limit — the same
# waiver, for the same math, as audiocore's.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[dependencies]
audiocore = { path = "../audiocore" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Bundled so the build needs no system sqlite at link time — the same
# hermeticity reason audiod gives, doubly so inside the Docker build.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# The SSO gate's stateless cookie: HMAC-SHA256 over a base64url payload, the same
# shape the Python mints so one sign-in serves both halves during the port.
hmac = "0.12"
base64 = "0.22"
form_urlencoded = "1"
# The OAuth code exchange and userinfo lookup. TLS is enabled EXPLICITLY here,
# unlike audiod's `default-features = false`: production reaches Nextcloud over
# plain http in-cluster (NC_INTERNAL_URL), but the fallback when that is unset is
# the public https origin, and a client that silently cannot make that call would
# be a masking fallback. ⚠ rustls, NOT tls-native — ort's default dragged in an
# openssl `rust:1-slim` does not carry, which cost an image build once already.
ureq = { version = "2", features = ["json", "tls"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# ⚠ A meeting's id is its LOCAL start (`meeting-20260703-0950`), and local means
# Europe/London, not the container's clock — which is UTC. Deriving the id in UTC
# would shift it by an hour all summer and mint a different id for the same
# recording, so it would no longer match the directory the worker discovered.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` is not optional here. Without it serde_json's parser is not
# correctly rounded: it reads the stored word timing 1.7599999999999953 as
# ...951, one ulp low, where Rust's own str::parse and Python both give the exact
# value. Word timings decide where a split lands, and a value that does not
# round-trip means a turn rewritten by recalld no longer matches the one Python
# wrote from the same blob.
# ⚠ `preserve_order` too: serde_json's Map is a BTreeMap by default, so it writes
# object keys ALPHABETICALLY where a Python dict preserves insertion order. Both
# implementations write the device-status settings blobs, and a reordered object
# is a different text for the same value.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# The atomic-write half of the durability order: stream into a temp file in
# the same filesystem, fsync, then rename into place — a name never points at
# partial bytes.
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ONNX runtime for the silero VAD (stage D4), loaded DYNAMICALLY from the
# system library rather than ort's prebuilt binaries.
#
# ⚠ ort's prebuilt ONNX Runtime REQUIRES AVX2, and the fleet's servers are Ivy
# Bridge (2012) — isis crash-looped with SIGILL when it first ran there. Debian's
# libonnxruntime is built for baseline x86-64 and runs on those CPUs (verified by
# running silero through it on amun, 2026-09-05), so the daemon dlopens that
# instead. `api-21` matches Debian trixie's 1.21; asking for a newer API than the
# library provides fails at load.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
