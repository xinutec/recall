# recalld — recall's system-of-record daemon on the fleet (docs/architecture.md).
#
# An append-only blob store behind an authenticated HTTP surface, with sha-256
# receipts the recorders verify before they will evict a local copy; plus VAD, the
# work queue and the browsing API.
#
# Shares posture with audiod: no unsafe, pedantic clippy, and the same segment-name
# grammar (`<source>-YYYYMMDDTHHMMSS.<ext>`).
[package]
name = "recalld"
version = "0.1.0"
edition = "2024"

[lints.rust]
# Sockets, files and SQL — nothing here needs unsafe, and `forbid` makes
# adding any a visible edit to this file.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (docs/standards.md §7; life is the reference table).
# `pedantic` does not cover these — they live in clippy's `restriction` group —
# so five recall crates denied none of them. Zero occurrences today, which is
# what makes this a ratchet rather than a cleanup.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A binary plus its own tests, not a published API; `# Errors` sections would
# document a boundary that does not exist.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# The calibration scanner's quantile arithmetic moves between usize/f64/f32 at
# a handful of deliberate sites, none near a precision limit — the same
# waiver, for the same math, as audiocore's.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
audiocore = { path = "../audiocore" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Bundled so the build needs no system sqlite at link time — the same
# hermeticity reason audiod gives, doubly so inside the Docker build.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
sha2 = "0.11"
# The SSO gate's stateless cookie: HMAC-SHA256 over a base64url payload, the same
# shape the Python mints so one sign-in serves both halves during the port.
hmac = "0.13"
base64 = "0.23"
form_urlencoded = "1"
# The OAuth code exchange and userinfo lookup. TLS is on, unlike audiod's: in the
# cluster Nextcloud is plain http (NC_INTERNAL_URL), but without that it is the
# public https origin, and a client that cannot reach it would fail silently.
# ⚠ rustls, not native TLS: that needs an openssl the `rust:1-slim` image lacks.
ureq = { version = "2", features = ["json", "tls"] }
hex = "0.4"
# The sync plane's token compare. Already in the tree as a transitive dep of
# `hmac`; named here because a hand-rolled equality on a shared secret is the
# kind of thing that looks constant-time and is not.
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# ⚠ A meeting's id is its local start (`meeting-20260703-0950`) in Europe/London,
# not the container's UTC: in UTC the id would be an hour off all summer and no
# longer match the directory the worker discovered.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# ⚠ Both features keep stored JSON byte-identical to what Python wrote.
# `float_roundtrip`: without it a word timing reads one ulp low, and word timings
# decide where a split lands. `preserve_order`: otherwise object keys are written
# sorted, where Python keeps insertion order.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# The atomic-write half of the durability order: stream into a temp file in
# the same filesystem, fsync, then rename into place — a name never points at
# partial bytes.
tempfile = "3"
tracing = "0.1"
# The frontend's types are generated from the structs below (`#[ts(export)]`);
# `scripts/gen-types.sh` writes them and the gate fails on drift.
ts-rs = { version = "12", features = ["serde-compat"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The ONNX runtime for the speech detector, loaded from the system library at
# runtime.
#
# ⚠ Not ort's prebuilt runtime: it needs AVX2, and the fleet's 2012 Ivy Bridge
# servers lack it (the daemon dies with SIGILL). Debian's runs on baseline x86-64.
# `api-21` matches Debian trixie's 1.21; asking for a newer API fails at load.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
audiocore = { path = "../audiocore" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
