# recalld: recall's system of record on the fleet (docs/architecture.md).
[package]
name = "recalld"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (docs/standards.md §7), from clippy's `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A binary, not a published API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Deliberate numeric conversions, none near a precision limit, as in
# audiocore.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[dependencies]
transcript = { path = "../transcript" }
clap = { version = "4", features = ["derive"] }
audiocore = { path = "../audiocore" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Bundled: no system sqlite at link time, in the Docker build too.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
sha2 = "0.11"
# The SSO gate's signed cookie.
hmac = "0.13"
base64 = "0.23"
form_urlencoded = "1"
# The OAuth calls. rustls: native TLS needs an openssl `rust:1-slim` lacks.
ureq = { version = "2", features = ["json", "tls"] }
hex = "0.4"
# The sync token's constant-time compare.
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Meeting ids are in Europe/London; the container runs UTC.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Stored JSON stays byte-identical to what Python wrote: `float_roundtrip` (a
# word timing would read one ulp low) and `preserve_order` (keys unsorted).
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
# Durable writes: temp file in the same filesystem, fsync, rename.
tempfile = "3"
tracing = "0.1"
# The frontend's types (`scripts/gen-types.sh`; the gate fails on drift).
ts-rs = { version = "12", features = ["serde-compat"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The speech detector's ONNX runtime, Debian's system library: ort's prebuilt
# one needs AVX2, which the fleet's Ivy Bridge servers lack (SIGILL). `api-21`
# matches Debian trixie's 1.21.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
audiocore = { path = "../audiocore" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
