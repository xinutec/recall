# The recall Rust workspace: one lockfile, one target dir. `members` below is the
# list; this summary may lag it.
#
#   audiocore  the shared DSP + segment-grammar library
#   audiod     the Mac's audio plane (capture, ingest, upload)
#   cli        the archive from a terminal, over the fleet's own API
#   doctor     the Mac's health agent, reporting to fleetwatch
#   recalld    the fleet's system-of-record daemon on Isis
#   runner     the Mac's job orchestration against recalld's queue
#   transcript the domain as pure data: clips, instants, spans (#1911)
#   experimental/playback  known speech played into the house, scored per mic (#1388)
[workspace]
resolver = "3"
members = [
    "audiocore",
    "audiod",
    "cli",
    "doctor",
    "experimental/playback",
    "recalld",
    "runner",
    "transcript",
]
