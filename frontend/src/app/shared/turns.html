<div class="transcript">
  @for (run of runs(); track run.key) {
    <div class="run" [class.named]="run.confirmed" [style.--c]="colourFor(run.speaker)">
      <div class="who">
        <button
          matIconButton
          class="play"
          [class.on]="player.playing() === 'run:' + run.key"
          (click)="togglePlay(run)"
          [attr.aria-label]="player.playing() === 'run:' + run.key ? 'pause' : 'hear this speaker'"
        >
          <mat-icon>{{ player.playing() === 'run:' + run.key ? 'pause' : 'play_arrow' }}</mat-icon>
        </button>
        <span class="clock">{{ clock(run.start) }}</span>
        <span class="name">{{ run.speaker }}</span>
        @if (run.guess !== null) {
          <span class="conf" title="An automatic guess, this likely">{{ pct(run.guess) }}</span>
        }
      </div>
      <p class="body">
        @for (t of run.turns; track t.id) {
          @if (sourceTags().get(t.id); as src) {
            <span class="src">{{ src }}</span>
          }
          <span
            class="t"
            role="button"
            tabindex="0"
            [attr.data-id]="t.id"
            [class.sel]="selected() === t.id"
            [class.provisional]="provisional(t)"
            [class.disputed]="disputed(t)"
            [attr.title]="disputed(t) ? 'The mics disagree on who said this' : null"
            (click)="openLine(t)"
            (keydown.enter)="openLine(t)"
            >{{ t.text }} </span
          >
          @if (mics(t) > 1) {
            <sup class="mics" [title]="'Heard by ' + mics(t) + ' mics'">{{ mics(t) }}</sup>
          }
        }
      </p>
    </div>
  }
</div>
