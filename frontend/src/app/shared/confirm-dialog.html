<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<!-- Cancel has the initial focus, so a stray Enter destroys nothing. -->
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" cdkFocusInitial>Cancel</button>
  <button
    mat-flat-button
    [class.destructive]="data.destructive"
    (click)="confirm()"
  >
    {{ data.confirm }}
  </button>
</mat-dialog-actions>
