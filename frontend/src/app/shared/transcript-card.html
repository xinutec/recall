@let t = transcript();
<mat-card appearance="outlined" class="turn">
  <mat-card-content>
    <div class="meta">
      <app-play-button [url]="t.audioUrl" label="hear this line" />
      <span class="clock">
        <mat-icon inline>schedule</mat-icon>
        {{ clock(t) }}
      </span>
      <mat-chip-set aria-label="turn details">
        @if (t.speaker) {
          <mat-chip highlighted>
            <mat-icon matChipAvatar>person</mat-icon>
            {{ t.speaker }}
          </mat-chip>
        } @else {
          <mat-chip><mat-icon matChipAvatar>help</mat-icon>unknown</mat-chip>
        }
      </mat-chip-set>
    </div>

    <p class="text">{{ t.text }}</p>
  </mat-card-content>
</mat-card>
