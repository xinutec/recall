[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (dev-lint's docs/standards.md §7), from clippy's
# `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "recall-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Blocking HTTP: one request at a time, so async buys nothing.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stored UTC to local wall-clock time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
# The tests run against the real router: a mock would encode this crate's
# beliefs about it.
recalld = { path = "../recalld" }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
tempfile = "3"
