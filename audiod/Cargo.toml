# audiod: recall's audio plane on a recording machine (src/lib.rs).
[package]
name = "audiod"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (docs/standards.md §7), from clippy's `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Sample counts, offsets and dB move between integer and float types, far from
# any precision limit (a segment is 60 s of 48 kHz s16).
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# A binary, not a published API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
audiocore = { path = "../audiocore" }
# The disconnect stats keep their written key order.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Bundled: no system sqlite at link time.
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The uploader (src/upload.rs); recalld is reached over https.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# The beat-relay parity corpus is read as typed cases (tests/beat_relay.rs).
serde = { version = "1", features = ["derive"] }
# tests/upload_real_server.rs runs the uploader against the real recalld
# router, not a copy of its protocol.
recalld = { path = "../recalld" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
