# doctor: is recall working? The Mac's health agent; posts its verdicts to
# fleetwatch. Its own crate, not part of audiod, because it reads the meaning
# plane too.
[package]
name = "doctor"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (dev-lint's docs/standards.md §7), from clippy's
# `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every cast is a duration in minutes or seconds headed for a message or a
# fleetwatch `value`, far from any precision limit.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Instants, filenames and the capture log as the rest of recall reads them.
# Not recalld, which would pull a web server into an agent that reads files.
audiocore = { path = "../audiocore" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS here only: fleetwatch is public https, while the other crates talk plain
# HTTP inside WireGuard. ureq's `tls` is rustls, so no openssl is needed.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
# The delivery check grades segments by mtime; tests age them with this.
filetime = "0.2"
