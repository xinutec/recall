[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (dev-lint's docs/standards.md §7), from clippy's
# `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
# The same speech detector as the archive, so both cut utterances alike.
audiocore = { path = "../audiocore" }
# Blocking HTTP: one job at a time, so async buys nothing.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# Instants in the system's one spelling, for the pulse and live turns.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
recalld = { path = "../recalld" }
# The end-to-end test reads back the row recalld wrote: a 200 says stored,
# not correct.
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
