[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
# The silero detector and WAV writing: the live tier must hear exactly what
# the archive hears, or one of them cuts an utterance the other keeps.
audiocore = { path = "../audiocore" }
# Blocking HTTP: the runner does one job at a time by design, so an async
# runtime would buy nothing and cost a dependency the Mac has to carry.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# ⚠ Wall-clock instants in the spelling the rest of the system parses
# (`datetime.isoformat()` — micros, offset, no `Z`): the archive pulse the doctor
# reads, and every live turn's start and end. The alternative was hand-formatting
# `SystemTime`, which is how two spellings of the same instant end up in one
# system.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
recalld = { path = "../recalld" }
# Reading back what the end-to-end test's recalld WROTE. A 200 from the push
# says stored, not correct; the row is the assertion.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
