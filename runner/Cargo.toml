[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
# Blocking HTTP: the runner does one job at a time by design, so an async
# runtime would buy nothing and cost a dependency the Mac has to carry.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# ⚠ For ONE thing: stamping the archive pulse the doctor reads, in the spelling
# the doctor parses (`datetime.isoformat()` — micros, offset, no `Z`). The
# alternative was hand-formatting `SystemTime`, which is how two spellings of the
# same instant end up in one system.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
recalld = { path = "../recalld" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
