# transcript — recall's domain: clips, instants, spans, and (later) the edit
# log and render (#1911). Pure by construction: no dependency here may do IO
# or read a clock (`scripts/check_pure_crate.py` refuses one), so nothing built
# on these types can quietly reach a database, a file or the time of day.
[package]
name = "transcript"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
