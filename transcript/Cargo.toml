# recall's domain: clips, instants, spans, the edit log and render (#1911).
# Pure: no dependency may do IO or read a clock (`scripts/check_pure_crate.py`).
[package]
name = "transcript"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
# Counts become ratios (word fractions, speaking rates): far inside f64's
# exact integer range, as in audiocore and recalld.
cast_precision_loss = "allow"
must_use_candidate = "allow"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
