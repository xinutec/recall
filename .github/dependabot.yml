# Dependabot has never read this repo's real lockfile.
#
# ⚠ Every alert on this repo names `frontend/package-lock.json`, which was
# DELETED when the frontend moved to pnpm. The dependency graph kept a snapshot
# of it and goes on matching NEW advisories against that snapshot, so this is not
# staleness that ages out — which is why this file exists at all: nothing had ever
# told Dependabot where to look.
#
# ⚠ Do NOT read that alert list as noise because the path is dead. Most alerted
# packages turn out already patched, and some are real and current. The only
# trustworthy check is each alert's vulnerable range against the version pnpm
# actually installed — see #1505.
#
# The `npm` ecosystem is the right one for pnpm; GitHub parses pnpm-lock.yaml
# under that name. `open-pull-requests-limit: 0` keeps the security ALERTS while
# refusing the version-bump PRs: this repo carries its floors deliberately in
# frontend/pnpm-workspace.yaml, with an argued reason per entry, and a bot
# raising PRs against them would fight that file every week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
