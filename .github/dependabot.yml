# Points Dependabot at the real lockfile.
#
# dev-lint: allow-doc-path the path GitHub's alerts still name, deleted on purpose
# Alerts name `frontend/package-lock.json`, deleted in the move to pnpm: GitHub's
# dependency graph kept a snapshot of it and still matches advisories against it.
# Check each alert's range against the version pnpm installed (#1505); some are
# current.
#
# `npm` is the ecosystem GitHub reads pnpm-lock.yaml under.
# `open-pull-requests-limit: 0` keeps the alerts without version-bump PRs: the
# floors in frontend/pnpm-workspace.yaml are deliberate, each with a reason.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
