---
name: build

# recall's FLEET image (recalld: browsing API + web + device ingest, no ML) — build +
# push xinutec/recall:latest to Docker Hub on push to main, the same way the other web
# apps do (health/life/coach/fleetwatch each have this workflow). The k8s manifests live
# in deploy/k8s (and, once deployed, the kubes monorepo); the image tag is the only
# contract.
#
# Unlike the pure-Node apps, recall's full gate can't run here: it needs nix + the
# mlx/pyannote venv, which is Apple-Silicon-only. So CI runs a light lint (ruff, no
# project deps) and lets the Docker build — which builds the frontend and compiles
# recalld for x86-64 — be the real build gate. The full gate (mypy, pytest, clippy,
# dev-lint, frontend) stays local on the Mac before each push.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Pinned to the same ruff the local gate runs (flake.nix -> pkgs.ruff).
      # Unpinned, the action tracks latest and CI enforces rules the pre-commit
      # gate cannot even see: 0.16.0 stabilised PLR0917 and failed a push that
      # was green locally on 0.15.20. Worse, the obvious fix (a noqa) would then
      # fail LOCALLY as an unused-noqa, since RUF100 is selected — so the two
      # must move together. Bump this and flake.nix in the same commit.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.20"
          args: format --check

  image:
    needs: lint
    runs-on: ubuntu-latest
    # Pushes to Docker Hub via the repo's DOCKERHUB_* secrets (set these on the recall
    # GitHub repo, as on the other app repos). GITHUB_TOKEN only reads the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build it, BOOT it, and only then publish it. Without the smoke step an image
      # that cannot run the app still gets tagged :latest and deployed — which is
      # exactly what happened: a lint fix dragged numpy into the serving chain of the
      # Python tier this image used to carry, and Isis CrashLoopBackOff'd on a green
      # build. The Dockerfile's dep set is a claim; running it is the proof.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: xinutec/recall:ci
          cache-from: type=registry,ref=xinutec/recall:cache

      - name: smoke — the image can run the app it exists to serve
        run: |
          # recalld is the whole program now. A binary that will not start — a
          # glibc mismatch between the build stage and the runtime base is the way
          # that happens — crash-loops on Isis and nowhere earlier. Bare argv prints
          # usage, which is proof it links and runs.
          docker run --rm xinutec/recall:ci \
            sh -c 'recalld 2>&1 | grep -q "usage: recalld"'
          # The web UI is half the point of the fleet tier; an image with no bundle is
          # a working API serving 404s.
          docker run --rm xinutec/recall:ci \
            test -f /app/frontend/dist/recall-web/browser/index.html
          # The binaries recalld SHELLS OUT to. Missing one is not a boot failure — it is
          # a 500 the first time somebody presses play, which is how `sox` reached
          # production: transcripts served perfectly, every audio request died.
          docker run --rm xinutec/recall:ci \
            sh -c 'for b in ffmpeg ffprobe sox flac deep-filter; do command -v "$b" >/dev/null || { echo "missing: $b"; exit 1; }; done'

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/recall:latest
          cache-from: type=registry,ref=xinutec/recall:cache
          cache-to: type=registry,ref=xinutec/recall:cache,mode=max
