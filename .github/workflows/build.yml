---
name: build

# Builds, smoke-tests and pushes xinutec/recall:latest (recalld with the web app) on
# every push to main. The image tag is the only contract with the k8s manifests.
#
# The full gate needs the Apple-Silicon ML venv, so it runs on the Mac before each
# commit; here only ruff runs, and the Docker build is the build check.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

# One build per branch at a time: with one `latest` tag, racing runs would leave it
# at whichever finished last, not the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # The ruff the local gate runs (flake.nix): a newer one enforces rules the
      # gate cannot see, and a noqa for them fails locally as unused (RUF100).
      # Bump both in one commit.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: format --check

  image:
    needs: lint
    runs-on: ubuntu-latest
    # Pushes with the repo's DOCKERHUB_* secrets; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build, run, then publish: an image that cannot run would otherwise be
      # tagged :latest and crash-loop on Isis.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: xinutec/recall:ci
          cache-from: type=registry,ref=xinutec/recall:cache

      - name: smoke — the image can run the app it exists to serve
        run: |
          # recalld links and runs (a glibc mismatch between stages would not):
          # without arguments it prints clap's usage.
          docker run --rm xinutec/recall:ci \
            sh -c 'recalld 2>&1 | grep -q "Usage: recalld"'
          # The web bundle is there.
          docker run --rm xinutec/recall:ci \
            test -f /app/frontend/dist/recall-web/browser/index.html
          # The tools recalld runs. A missing one fails no boot, only the first
          # request that needs it.
          docker run --rm xinutec/recall:ci \
            sh -c 'for b in ffmpeg ffprobe sox flac deep-filter; do command -v "$b" >/dev/null || { echo "missing: $b"; exit 1; }; done'

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/recall:latest
          cache-from: type=registry,ref=xinutec/recall:cache
          cache-to: type=registry,ref=xinutec/recall:cache,mode=max
