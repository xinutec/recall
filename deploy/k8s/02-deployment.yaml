# recall's fleet tier: api + web + the sync ingest, one container. NO ML runs here (the
# Mac keeps capture/ASR/diarize/LLM) — this is a light FastAPI + SQLite + static frontend.
# The sync routes only exist when RECALL_SYNC_TOKEN is set (from the recall-secret), and
# they are meant to be reached over WireGuard only (see 03-service.yaml + README), never
# the shared public nginx ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall
  namespace: recall
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO PVC — never two pods writing the archive at once
  selector:
    matchLabels:
      app: recall
  template:
    metadata:
      labels:
        app: recall
    spec:
      # dash.xinutec.org is Isis's OWN public IP — Nextcloud is co-located on this node.
      # A pod cannot reach the node's public IP (hairpin → connection refused), so the
      # SSO server-side token/userinfo calls to dash must go through the in-cluster nginx
      # ingress instead. Pin dash to the ingress-nginx controller's ClusterIP: the pod
      # then reaches Nextcloud over the exact same TLS+routing path the browser does
      # (SNI/Host = dash.xinutec.org, valid cert, ingress routes to nextcloud-server).
      # Only the pod's own outbound calls use this; the browser resolves dash via real
      # public DNS. NOTE: if ingress-nginx is reinstalled and its ClusterIP changes,
      # update this IP (symptom would be SSO login → 502, "connection refused" in logs).
      hostAliases:
        - ip: "10.43.65.74"
          hostnames:
            - "dash.xinutec.org"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000  # so uid 1000 can write the archive PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recall
          image: xinutec/recall:latest
          imagePullPolicy: Always
          # --out sets the data root; `recall api` overwrites RECALL_OUT from it, so the
          # env below can't be relied on — the flag is what binds the archive to /data.
          command:
            ["python", "-m", "recall", "api", "--out", "/data",
             "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            # THE network gate. `hostIP` is the whole point: a bare hostPort would DNAT
            # on every address Isis has, including its public one — and a k8s hostPort
            # rule bypasses the NixOS firewall entirely (it lands in the nat table ahead
            # of it), so "the firewall will catch it" is false here. Pinned to Isis's
            # WireGuard address, the DNAT rule can only match a packet that arrived on
            # wg0. The public IP never answers on 8000; there is nothing to firewall.
            #
            # Not an nginx Ingress, deliberately: the shared ingress answers on Isis's
            # public IP whatever DNS says — obscurity, not a gate (confirmed 2026-07-09).
            # The hostPort IS the gate here, not a hole in one. The rule's advice ("use a
            # Service") is the wrong move for recall: a Service still needs an Ingress to
            # be reachable from the Mac, and the shared ingress answers on Isis's PUBLIC
            # IP whatever DNS says. Bound to the WireGuard address, this port cannot be
            # reached from the internet at all.
            - containerPort: 8000
              hostPort: 8000 # dev-lint: allow-host-port — bound to wg0 only, see hostIP
              hostIP: 10.100.0.2
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            # System-of-record role: is_fleet() reads this to serve /data from the PVC
            # and hold capture intent without running a capture agent. Load-bearing —
            # do not drop it (RECALL_SYNC_TOKEN alone can't distinguish Mac from fleet).
            - name: RECALL_ROLE
              value: "fleet"
            - name: RECALL_SYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: SYNC_TOKEN
            # Nextcloud SSO over the human web UI (recall.webauth). All three keys must
            # be present to raise the gate; missing any of them leaves recall an open LAN
            # UI (same inert-unless-configured contract as the sync token). optional:true
            # is deliberate: applying this manifest before the keys exist must NOT wedge
            # the pod (CreateContainerConfigError) — the env just stays unset, gate off.
            - name: RECALL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: SESSION_SECRET
                  optional: true
            - name: NC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: NC_CLIENT_ID
                  optional: true
            - name: NC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: recall-secret
                  key: NC_CLIENT_SECRET
                  optional: true
            # Non-secret: who may sign in (empty = any dash user) and the OAuth redirect
            # the browser is sent back to — must match the client's registered URI on
            # dash and the address the browser actually loads recall at (the wg0 hostPort).
            - name: RECALL_ALLOWED_USERS
              value: "pippijn"
            - name: NC_REDIRECT_URI
              value: "http://10.100.0.2:8000/auth/callback"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recall-data-pvc
        # readOnlyRootFilesystem is on, so every path the app writes needs a mount:
        # /tmp (ffmpeg scratch) and /app/logs (log rotation + client-error log).
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
