# Default-deny egress for the namespace. The recall pod serves requests and reads/writes
# its local SQLite; its only outbound calls are to Nextcloud (dash.xinutec.org) for the
# web-UI SSO token exchange + user lookup. So egress is denied except DNS and that one
# destination — containing a compromised pod from exfiltrating. Deliberately egress-only:
# kubelet liveness/readiness
# probes are node-sourced *ingress*, which a default-deny-ingress policy drops under k3s'
# kube-router (the trap that keeps the app-ingress policies held elsewhere in the fleet),
# so restricting ingress here would take the pod NotReady. Ingress is gated at the network
# layer instead (WireGuard-only Service, no public ingress — see 03-service.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: recall
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # SSO: reach Nextcloud (dash.xinutec.org) via the in-cluster ingress on 443. dash is
    # co-located on this node and unreachable via the public IP (hairpin), so the pod goes
    # through the nginx ingress ClusterIP (see the deployment's hostAlias for dash).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 443
          protocol: TCP
