[package]
name = "room"
version = "0.1.0"
edition = "2024"
publish = false
description = "The room stream, an experiment: run by hand on a copy of the fleet's data, never deployed (#1388)."

[dependencies]
audiocore = { path = "../../audiocore" }
recalld = { path = "../../recalld" }
runner = { path = "../../runner" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Level arithmetic moves between f32 and f64 at a few deliberate sites.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
