# audiocore — what recall's Rust crates must not fork; src/lib.rs says why.
#
# ⚠ The STFT and the fusion engine were REMOVED 2026-09-20. Waveform fusion is
# settled dead on the Opus archive — it lost to the best single microphone and
# the control proved the loss belonged to the algorithms, not the pipeline
# (#1388). Nothing called either module; the numbers are in the task.
[package]
name = "audiocore"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (docs/standards.md §7; life is the reference table).
# `pedantic` does not cover these — they live in clippy's `restriction` group —
# so five recall crates denied none of them. Zero occurrences today, which is
# what makes this a ratchet rather than a cleanup.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = "1"
# ONNX runtime for the silero VAD, loaded DYNAMICALLY from the system library
# rather than ort's prebuilt binaries.
#
# ⚠ ort's prebuilt ONNX Runtime REQUIRES AVX2, and the fleet's servers are Ivy
# Bridge (2012) — isis crash-looped with SIGILL when it first ran there. Debian's
# libonnxruntime is built for baseline x86-64 and runs on those CPUs, so the
# daemon dlopens that instead. `api-21` matches Debian trixie's 1.21; asking for
# a newer API than the library provides fails at load.
#
# It lives HERE rather than in recalld because the Mac needs the SAME detector:
# a Mac-local speech measurement and the fleet's must agree by construction, or
# one can call a segment silent while the other hears speech — and one of those
# two answers is a licence to delete audio.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
# The frozen quality corpus is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
