# audiocore: what recall's Rust crates must not fork (src/lib.rs). Waveform
# fusion lost to the best single microphone (#1388) and was removed.
[package]
name = "audiocore"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (dev-lint's docs/standards.md §7), from clippy's
# `restriction` group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
transcript = { path = "../transcript" }
# The probe's and examples' argv.
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only so `job::Kind` can be a column type.
rusqlite = { version = "0.40", features = ["bundled"] }
# The speech detector's ONNX runtime, Debian's system library: ort's prebuilt
# one needs AVX2, which the fleet's Ivy Bridge servers lack (SIGILL). `api-21`
# matches Debian trixie's 1.21. Here so the Mac and the fleet run the same
# detector.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
tempfile = "3"
