# audiocore — what recall's Rust crates must not fork; src/lib.rs says why.
#
# Waveform fusion is settled (#1388): it lost to the best single microphone, so
# its STFT and fusion engine are gone and should not come back for it.
[package]
name = "audiocore"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The fleet baseline (docs/standards.md §7; life is the reference table).
# `pedantic` does not cover these — they live in clippy's `restriction` group —
# so five recall crates denied none of them. Zero occurrences today, which is
# what makes this a ratchet rather than a cleanup.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
# The probe's and examples' argv.
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for `job::Kind` to be a column type: every crate that stores a kind
# already links it.
rusqlite = { version = "0.40", features = ["bundled"] }
# The ONNX runtime for the speech detector, loaded from the system library.
#
# ⚠ Not ort's prebuilt runtime: it needs AVX2, and the fleet's 2012 Ivy Bridge
# servers lack it (the daemon dies with SIGILL). Debian's runs on baseline x86-64.
# `api-21` matches Debian trixie's 1.21; asking for a newer API fails at load.
#
# Here rather than in recalld because the Mac and the fleet must run the same
# detector: if one calls a minute silent while the other hears speech, the
# silent answer is a licence to delete audio.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

[dev-dependencies]
tempfile = "3"
