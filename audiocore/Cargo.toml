# audiocore — the DSP and segment-grammar library both daemons read
# (docs/architecture.md, stage D1).
#
# What lives here is exactly what must not fork: the segment-name grammar
# (names), decode/align/envelope (the tier-1 aligner), the STFT and the
# measured-and-bounded fusion engine, and WAV I/O. audiod (the Mac's audio
# plane) and recalld (the fleet's system of record) both depend on it; the
# room builder (stage D3) is its next consumer.
[package]
name = "audiocore"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
# The one FFT implementation to trust — same reasoning as audiod's original.
rustfft = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# ONNX runtime for the silero VAD, loaded DYNAMICALLY from the system library
# rather than ort's prebuilt binaries.
#
# ⚠ ort's prebuilt ONNX Runtime REQUIRES AVX2, and the fleet's servers are Ivy
# Bridge (2012) — isis crash-looped with SIGILL when it first ran there. Debian's
# libonnxruntime is built for baseline x86-64 and runs on those CPUs, so the
# daemon dlopens that instead. `api-21` matches Debian trixie's 1.21; asking for
# a newer API than the library provides fails at load.
#
# It lives HERE rather than in recalld because the Mac needs the SAME detector:
# a Mac-local speech measurement and the fleet's must agree by construction, or
# one can call a segment silent while the other hears speech — and one of those
# two answers is a licence to delete audio.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-21",
] }

